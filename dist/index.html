<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="application-version" content="3.0.1"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0a11"><meta name="description" content="像素恒星合成游戏：从红矮星到星系中心。"><title>合成大恒星</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0a11'/%3E%3Cpath d='M16 3L19 13L29 16L19 19L16 29L13 19L3 16L13 13Z' fill='%23efbd95'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css?v=3.0.1"></head>
<body>
<main class="game">
  <header><h1><span aria-hidden="true">✦</span> 合成大恒星</h1><button id="settings-open" class="icon-button" title="选项" aria-label="游戏选项">☷</button></header>
  <section class="hud" aria-label="游戏状态"><div><span class="label">得分</span><strong id="score">0</strong></div><div class="record"><span class="label">最佳 <b id="best">0</b></span><time id="timer">00:00</time></div><div class="next"><span class="label">下一颗</span><span id="next-type" class="type-chip">M</span><span id="next-mass">0.25 M☉</span></div></section>
  <div class="goal"><span>黑洞 <b id="bh-mass">0</b> / 2,000 M☉</span><div class="track"><div id="mass-progress"></div></div></div>
  <section id="canvas-wrap" class="stage" aria-label="恒星合成场">
    <canvas id="universe" width="700" height="820" tabindex="0" aria-label="拖动调整位置，点击或长按连续投放。左右方向键移动，空格投放，P暂停。查看模式下点击天体显示内部元素。"></canvas>
    <div id="danger" class="danger" hidden>已到警戒线 · 尽快合成</div>
    <div class="board-status"><span id="field-status">等待投放</span><span id="body-count"></span></div>
    <div id="ready-overlay" class="overlay ready"><span class="small-star" aria-hidden="true">✦</span><h2>从一颗星开始。</h2><p>同类相遇，合成更大的恒星。</p><button id="start" class="primary">开始合成</button><span class="hint">点击投放 · 长按连续投放</span></div>
    <div id="state-overlay" class="overlay" hidden><h2 id="state-title">已暂停</h2><p id="state-detail"></p><div id="end-stats"></div><button id="state-action" class="primary">继续游戏</button></div>
    <div id="cinema-caption" class="cinema" hidden><span>数亿年后</span><h2>星系，有了自己的心脏。</h2></div>
    <div id="body-info" class="body-info" hidden><button id="info-close" class="icon-button" aria-label="关闭天体信息">×</button><strong id="info-name"></strong><span id="info-mass"></span><div id="info-layers"></div><p id="info-evolution"></p></div>
  </section>
  <div class="toolbar"><button id="pause" disabled aria-label="暂停游戏"><span aria-hidden="true">Ⅱ</span> 暂停</button><button id="mode" aria-pressed="false"><span aria-hidden="true">◎</span> 查看</button><button id="restart"><span aria-hidden="true">↻</span> 重来</button></div>
  <div class="sequence" aria-label="恒星合成顺序"><span style="--color:#ff7950">M</span><i>›</i><span style="--color:#ffc36c">K</span><i>›</i><span style="--color:#ffe194">G</span><i>›</i><span style="--color:#fff0cc">F</span><i>›</i><span style="--color:#d7edff">A</span><i>›</i><span style="--color:#accbff">B</span><i>›</i><span style="--color:#c5b9ff">O</span></div>
</main>
<dialog id="settings-dialog"><div class="dialog-title"><h2>游戏选项</h2><button id="settings-close" class="icon-button" aria-label="关闭选项">×</button></div><label>音效<input id="setting-sound" type="checkbox"></label><label>恒星内部剖面<input id="setting-layers" type="checkbox" checked></label><label>光线偏折<input id="setting-lensing" type="checkbox" checked></label><label>更多粒子<input id="setting-quality" type="checkbox" checked></label><label>减弱震动与闪光<input id="setting-motion" type="checkbox"></label><p>同型恒星合成；黑洞达到 2,000 M☉ 通关。<br>中子星不会因吸积变成黑洞，仍可并合。<br>查看模式可点击天体，了解质量与元素分层。</p></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="./app.js?v=3.0.1"></script>
</body></html>
